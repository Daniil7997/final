name: team_management_test


services:

  db:
    extends:
      file: base.yaml
      service: db
    volumes:
      - db_data_test:/var/lib/postgresql/data

  redis:
    extends:
      file: base.yaml
      service: redis
    volumes:
      - redis_data_test:/data

  fastapi:
    extends:
      file: base.yaml
      service: fastapi
    env_file:
      - .env.test
    environment:
      - PYTHONUNBUFFERED=1
    build:
      context: .
      target: "test"
    command: sh -c "alembic upgrade head && python -m pytest -s -v --cov=app --cov-report=term-missing && mypy app"
    ports: 
      - "8000:8000"
    volumes:
      - .:/project


volumes:
  db_data_test:
  redis_data_test:


networks:
  app_network:
    driver: bridge
