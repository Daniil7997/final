[mypy]
plugins = sqlalchemy.ext.mypy.plugin
mypy_path = .
# explicit_package_bases = True
# namespace_packages = True

# Убрать предупреждение mypy об объявлении полей без значения 
# по умолчанию после полей со значением по умолчанию
# "Attributes without a default cannot follow attributes with one"
# необходима установка sqlalchemy[mypy] в dev категорию
# и указание kw_only=True для каждой таблицы в которой нарушается
# требование порядка полей default - non default
[mypy-app.models.*]
disable_error_code = misc
